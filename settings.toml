config_version = 8

[bar.default]
background_opacity = 0.57999998703598976
center = [ "workspaces" ]
concave_edge_corners = true
end = [ "privacy", "notifications", "tray", "volume", "brightness", "battery", "bar", "bluetooth", "network", "launcher" ]
margin_edge = 0
margin_ends = 0
radius = 0
