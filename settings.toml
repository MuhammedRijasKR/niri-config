radius_bottom_right = 79
start = [ "clock", "date", "weather", "spacer_5", "cpu", "ram", "spacer_3", "media", "audio_visualizer" ]
widget_spacing = 10

    [bar.default.dead_zone.actions]
    scroll_down = "volume-down 2"
    scroll_up = "volume-up 2"

[battery]
warning_threshold = 20

[brightness]
minimum_brightness = 0.0099999997764825821

[desktop_widgets]
