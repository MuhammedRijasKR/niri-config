[plugins]
enabled = [
    "yuuto/calculator",
    "blackbartblues/keymap",
    "imjustdoingmypart/niri-animations",
    "alexander/screen-toolkit",
    "cleboost/ssh-launcher",
    "nightwatch75/todo"
]

[shell]
external_ip_enabled = true
font_family = "Bitstream Vera Serif"
password_style = "random"
screen_time_enabled = true
settings_show_advanced = true
time_format = "{:%-I:%M %p}"

    [shell.launcher]
    app_grid = true

    [shell.panel]
    open_near_click_control_center = true
    session_position = "center"
    wallpaper_position = "bottom_left"

    [shell.screen_corners]
    enabled = true
    size = 28

    [shell.screenshot]
    directory = "/home/rijas/Pictures/Screenshots"

[theme]
builtin = "Ayu"
community_palette = "Ayu Blue"
custom_palette = "b-374-mc"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "ghostty", "kitty", "niri", "qt" ]
    community_ids = [ "spicetify", "zen-browser", "telegram", "libreoffice", "neovim", "vscode", "fastfetch" ]

[wallpaper]
transition = [ "disc", "honeycomb", "stripes", "wipe", "zoom" ]
transition_on_startup = true

    [wallpaper.default]
    path = "/home/rijas/Pictures/Wallpapers/b-871.jpg"

    [wallpaper.last]
    path = "/home/rijas/Pictures/Wallpapers/b-871.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/rijas/Pictures/Wallpapers/b-871.jpg"

    [[wallpaper.favorite]]
    palette_source = "wallpaper"
    path = "/home/rijas/Pictures/Wallpapers/b-193.jpg"
    theme_mode = "dark"
    wallpaper_scheme = "m3-content"

[weather]
refresh_minutes = 60

[widget.audio_visualizer]
bands = 32
width = 128

[widget.bar]
type = "yuuto/calculator:bar"

[widget.clock]
format = "{:%-I:%M %p}"

[widget.cpu]
display = "text"

[widget.media]
